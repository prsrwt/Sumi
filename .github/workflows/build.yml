# Runs on every push and pull request: the unit tests, the em dash check (which
# every Gradle build runs first) and a debug build. Release builds need the
# signing key, which never leaves the maintainer's machine, so they are not built here.
name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/
