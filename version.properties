# The one place a Sumi release is numbered.
#
# versionCode is what Google Play orders uploads by. It must rise by at least one
# for every build uploaded to any track, and it can never be reused, not even for
# a build that was rejected or rolled back.
#
# versionName is what people read, on the Setup screen and in the store listing.
# Major for a release that changes what Sumi is, minor for a feature, patch for
# fixes.
versionCode=1
versionName=1.0.0
